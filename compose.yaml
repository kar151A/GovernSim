name: governsim
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: governsim
      POSTGRES_USER: governsim
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python scripts/bootstrap.py first}
    # Keep registry and audit records across container replacement.
    volumes:
      - governsim-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U governsim -d governsim"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  app:
    build: .
    # Local-only browser entry point; PostgreSQL has no host port mapping.
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://governsim:${POSTGRES_PASSWORD}@db:5432/governsim
      GOVERNSIM_AUTH_KEY: ${GOVERNSIM_AUTH_KEY:?Run python scripts/bootstrap.py first}
      GOVERNSIM_AUTH_COOKIE_SECURE: ${GOVERNSIM_AUTH_COOKIE_SECURE:-false}
      GOVERNSIM_AUTH_ORIGINS: ${GOVERNSIM_AUTH_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
      GOVERNSIM_ALLOW_LEGACY_API_KEYS: ${GOVERNSIM_ALLOW_LEGACY_API_KEYS:-false}
      GOVERNSIM_API_KEYS: ${GOVERNSIM_API_KEYS:-}
      SEED_DEMO: ${SEED_DEMO:-false}
      LLM_PROVIDER: ${LLM_PROVIDER:-offline}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    init: true
    # Persistent application data lives in PostgreSQL, not the image filesystem.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
# docker compose down retains this volume; down -v removes it.
volumes:
  governsim-data:
